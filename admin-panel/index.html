<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a0a" />
<title>MMUST Market Admin</title>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #121212;
  --surface2: #1a1a1a;
  --border: #262626;
  --accent: #39ff14;
  --accent-glow: rgba(57,255,20,0.35);
  --text: #f5f5f5;
  --text-muted: #9a9a9a;
  --danger: #ff4d4d;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.45; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }

.topbar {
  height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  border-bottom: 1px solid var(--border); background: rgba(9,9,9,0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20;
}
.brand { font-weight: 800; font-size: 16px; letter-spacing: 0.5px; }
.brand span { color: var(--accent); }
.main { padding: 16px; max-width: 1100px; margin: 0 auto; width: 100%; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card + .card { margin-top: 16px; }

.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }

.input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.btn { padding: 10px 16px; border-radius: var(--radius); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--accent); color: #04150a; }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.stat-value { font-size: 24px; font-weight: 800; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; min-width: 640px; }
.table th, .table td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
.table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }

.badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge-pending { background: rgba(255,170,0,0.15); color: #ffaa00; border: 1px solid rgba(255,170,0,0.3); }
.badge-approved { background: rgba(57,255,20,0.12); color: var(--accent); border: 1px solid rgba(57,255,20,0.3); }
.badge-rejected { background: rgba(255,77,77,0.12); color: var(--danger); border: 1px solid rgba(255,77,77,0.3); }

.toggle { position: relative; width: 44px; height: 24px; background: var(--surface2); border-radius: 12px; border: 1px solid var(--border); cursor: pointer; transition: background 0.2s; }
.toggle.active { background: var(--accent); border-color: var(--accent); }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; transition: transform 0.2s; }
.toggle.active .toggle-knob { transform: translateX(20px); }

.nav { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.nav button { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-weight: 600; }
.nav button.active { background: var(--accent); color: #04150a; border-color: var(--accent); }

.empty { text-align: center; padding: 48px 16px; color: var(--text-muted); }
.error { color: var(--danger); padding: 10px 12px; background: rgba(255,77,77,0.12); border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

@media (max-width: 768px) {
  .topbar { padding: 0 12px; }
  .brand { font-size: 14px; }
  .main { padding: 12px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-card { padding: 12px; }
  .stat-value { font-size: 20px; }
  .table th, .table td { padding: 10px; font-size: 13px; }
  .btn { padding: 8px 12px; font-size: 13px; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const SUPABASE_URL = 'https://pvrrnshblbbvtcnsartw.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2cnJuc2hibGJidnRjbnNhcnR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NzEzNjgsImV4cCI6MjEwMDM0NzM2OH0.NxRqLFPcxHehkpZwQpOe8Wvbst9e3Mclm-W5hBh6-Gs'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const root = document.getElementById('root')

function q(sel) { return document.querySelector(sel) }
function show(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html }

async function loadAppSettings() {
  const { data } = await supabase.from('app_settings').select('*')
  return data?.reduce((a, b) => ({ ...a, [b.key]: b.value }), {}) || {}
}

async function loadStats() {
  const [{ count: users }, { count: listings }, { count: pending }, { count: approved }] = await Promise.all([
    supabase.from('profiles').select('*', { count: 'exact', head: true }),
    supabase.from('listings').select('*', { count: 'exact', head: true }),
    supabase.from('listings').select('*', { count: 'exact', head: true }).eq('status', 'pending'),
    supabase.from('listings').select('*', { count: 'exact', head: true }).eq('status', 'approved'),
  ])
  return { users: users || 0, listings: listings || 0, pending: pending || 0, approved: approved || 0 }
}

async function loadListings(filter) {
  let query = supabase.from('listings').select('*').order('created_at', { ascending: false })
  if (filter && filter !== 'all') query = query.eq('status', filter)
  const { data } = await query
  return data || []
}

async function updateSetting(key, value) {
  const res = await supabase.from('app_settings').update({ value, updated_at: new Date().toISOString() }).eq('key', key)
  if (res.error) alert('Setting update failed: ' + res.error.message)
  return res
}

async function updateListingStatus(id, status) {
  const res = await supabase.from('listings').update({ status, approved_at: status === 'approved' ? new Date().toISOString() : null }).eq('id', id)
  if (res.error) alert('Listing update failed: ' + res.error.message)
  return res
}

function renderLogin(error = '') {
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1 style="margin:0 0 4px;font-size:24px;">MMUST<span style="color:var(--accent)">Market</span></h1>
        <p style="color:var(--text-muted);margin:0 0 24px;">Admin Dashboard</p>
        ${error ? `<div class="error">${error}</div>` : ''}
        <button class="btn btn-primary" id="loginBtn" style="width:100%;padding:14px;font-size:15px;">Sign in</button>
      </div>
    </div>
  `
  q('#loginBtn').addEventListener('click', async () => {
    const email = 'musty@mmustmarket.local'
    const password = '5224'
    const { data, error } = await supabase.auth.signInWithPassword({ email, password })
    if (error) { renderLogin(error.message); return }
    const { data: admin, error: adminError } = await supabase.from('admins').select('*').eq('id', data.user.id).single()
    if (adminError) { renderLogin('Admin lookup failed: ' + adminError.message + ' (uid=' + data.user.id + ')'); return }
    if (!admin) { renderLogin('Admin access not found for uid=' + data.user.id); return }
    renderApp()
  })
}

async function renderApp() {
  root.innerHTML = `
    <div class="app">
      <header class="topbar">
        <div class="brand">MMUST<span>Market</span> <span style="color:var(--text-muted);font-size:12px;margin-left:8px;">Admin</span></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="color:var(--text-muted);font-size:13px;">Admin</span>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Logout</button>
        </div>
      </header>
      <main class="main">
        <div class="nav">
          <button class="active" data-page="dashboard">Dashboard</button>
          <button data-page="listings">Listings</button>
          <button data-page="settings">Settings</button>
        </div>
        <div id="page"></div>
      </main>
    </div>
  `

  q('#logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut()
    renderLogin()
  })

  const pageEl = q('#page')
  const navButtons = qAll('[data-page]')

  async function showPage(name) {
    navButtons.forEach(b => b.classList.toggle('active', b.dataset.page === name))
    if (name === 'dashboard') await renderDashboard(pageEl)
    else if (name === 'listings') await renderListings(pageEl)
    else if (name === 'settings') await renderSettings(pageEl)
  }

  navButtons.forEach(b => b.addEventListener('click', () => showPage(b.dataset.page)))
  await showPage('dashboard')
}

async function renderDashboard(el) {
  const [stats, recent] = await Promise.all([loadStats(), loadListings('all')])
  const rows = recent.slice(0, 5).map(item => `
    <tr>
      <td style="font-weight:600">${item.title}</td>
      <td style="text-transform:capitalize">${item.type}</td>
      <td>Ksh ${Number(item.price).toLocaleString()}${item.type === 'house' ? '/mo' : ''}</td>
      <td><span class="badge badge-${item.status}">${item.status}</span></td>
      <td style="color:var(--text-muted);font-size:12px;">${new Date(item.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('')
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value">${stats.users}</div><div class="stat-label">Users</div></div>
      <div class="stat-card"><div class="stat-value">${stats.listings}</div><div class="stat-label">Total Listings</div></div>
      <div class="stat-card"><div class="stat-value" style="color:#ffaa00">${stats.pending}</div><div class="stat-label">Pending Review</div></div>
      <div class="stat-card"><div class="stat-value">${stats.approved}</div><div class="stat-label">Approved</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:16px;font-weight:700;">Recent Listings</h3>
      </div>
      ${recent ? `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Title</th><th>Type</th><th>Price</th><th>Status</th><th>Created</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      ` : '<div class="empty">No listings yet.</div>'}
    </div>
  `
}

async function renderListings(el) {
  let filter = 'all'
  let items = []

  async function refresh() {
    const [allItems, pendingItems, approvedItems, rejectedItems] = await Promise.all([
      loadListings('all'),
      loadListings('pending'),
      loadListings('approved'),
      loadListings('rejected'),
    ])
    items = allItems
    return { all: allItems.length, pending: pendingItems.length, approved: approvedItems.length, rejected: rejectedItems.length }
  }

  const counts = await refresh()

  function buildTable() {
    const filtered = filter === 'all' ? items : items.filter(i => i.status === filter)
    const rows = filtered.map(item => `
      <tr>
        <td style="font-weight:600">${item.title}</td>
        <td style="text-transform:capitalize">${item.type}</td>
        <td>${item.category}</td>
        <td>Ksh ${Number(item.price).toLocaleString()}${item.type === 'house' ? '/mo' : ''}</td>
        <td style="color:var(--text-muted)">${item.location}</td>
        <td style="color:var(--text-muted);font-size:13px;">${item.phone}</td>
        <td style="color:var(--text-muted);font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.description || ''}</td>
        <td><span class="badge badge-${item.status}">${item.status}</span></td>
        <td style="color:var(--text-muted);font-size:12px;">${new Date(item.created_at).toLocaleDateString()}</td>
        <td>
          ${filter === 'pending' || filter === 'all' ? `
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-primary btn-sm" onclick="window._approve('${item.id}')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="window._reject('${item.id}')">Reject</button>
            </div>
          ` : '<span style="color:var(--text-muted);font-size:12px;">—</span>'}
        </td>
        <td>
          <button class="btn btn-ghost btn-sm" onclick="window._delete('${item.id}')" style="color:var(--danger);border-color:var(--danger);">Delete</button>
        </td>
      </tr>
    `).join('')

    el.innerHTML = `
      <div class="nav" id="filterNav">
        <button data-filter="all" class="${filter === 'all' ? 'active' : ''}">All (${counts.all})</button>
        <button data-filter="pending" class="${filter === 'pending' ? 'active' : ''}">Pending (${counts.pending})</button>
        <button data-filter="approved" class="${filter === 'approved' ? 'active' : ''}">Approved (${counts.approved})</button>
        <button data-filter="rejected" class="${filter === 'rejected' ? 'active' : ''}">Rejected (${counts.rejected})</button>
      </div>
      <div class="card">
        ${filtered.length === 0 ? '<div class="empty">No listings.</div>' : `
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th>Title</th><th>Type</th><th>Category</th><th>Price</th><th>Location</th><th>Phone</th><th>Description</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `}
      </div>
    `

    q('#filterNav').addEventListener('click', (e) => {
      if (e.target.dataset.filter) {
        filter = e.target.dataset.filter
        buildTable()
      }
    })
  }

  window._approve = async (id) => {
    const res = await updateListingStatus(id, 'approved')
    if (res.error) alert('Approve failed: ' + res.error.message)
    const newCounts = await refresh()
    Object.assign(counts, newCounts)
    buildTable()
  }
  window._reject = async (id) => {
    const res = await updateListingStatus(id, 'rejected')
    if (res.error) alert('Reject failed: ' + res.error.message)
    const newCounts = await refresh()
    Object.assign(counts, newCounts)
    buildTable()
  }
  window._delete = async (id) => {
    const res = await supabase.from('listings').delete().eq('id', id)
    if (res.error) alert('Delete failed: ' + res.error.message)
    const newCounts = await refresh()
    Object.assign(counts, newCounts)
    buildTable()
  }
  buildTable()
}

async function renderSettings(el) {
  const settings = await loadAppSettings()
  const rows = Object.entries(settings).map(([key, value]) => `
    <tr>
      <td style="font-weight:600">${key}</td>
      <td>
        <div class="toggle ${value === 'true' ? 'active' : ''}" data-key="${key}">
          <div class="toggle-knob"></div>
        </div>
      </td>
    </tr>
  `).join('')
  el.innerHTML = `
    <div class="card">
      <table class="table">
        <thead><tr><th>Setting</th><th>Value</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `
  qAll('.toggle').forEach(t => {
    t.addEventListener('click', async () => {
      const key = t.dataset.key
      const next = t.classList.contains('active') ? 'false' : 'true'
      t.classList.toggle('active', next === 'true')
      const res = await updateSetting(key, next)
      if (res.error) alert('Setting update failed: ' + res.error.message)
    })
  })
}

function qAll(sel) { return document.querySelectorAll(sel) }

renderLogin()
</script>
</body>
</html>
